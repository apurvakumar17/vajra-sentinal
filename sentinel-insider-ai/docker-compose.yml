

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - MONGODB_URI=mongodb://mongo:27017
      - REDIS_URI=redis://redis:6379
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      - mongo
      - redis
    networks:
      - sentinel_net

  mongo:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - sentinel_net

  redis:
    image: redis:7.0-alpine
    ports:
      - "6379:6379"
    networks:
      - sentinel_net

volumes:
  mongo_data:

networks:
  sentinel_net:
